syntax = "proto3";
package zengine.gameplay.v1;
option csharp_namespace = "Game.Protocol";
// Never reuse field numbers. Version is mandatory at the application layer.

enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_BUSY = 3;
  ERROR_CODE_BLOCKED = 4;
  ERROR_CODE_INSUFFICIENT_MANA = 5;
  ERROR_CODE_COOLDOWN = 6;
  ERROR_CODE_UNSUPPORTED_VERSION = 7;
  ERROR_CODE_INTERNAL = 8;
}
enum AttributeId {
  ATTRIBUTE_ID_NONE = 0;
  ATTRIBUTE_ID_MAX_HP = 1;
  ATTRIBUTE_ID_HP = 2;
  ATTRIBUTE_ID_ATTACK = 3;
  ATTRIBUTE_ID_MANA = 4;
  ATTRIBUTE_ID_MAX_MANA = 5;
}
enum ModifierOp { MODIFIER_OP_ADD = 0; MODIFIER_OP_PERCENT_ADD = 1; }
enum DurationPolicy { DURATION_POLICY_INSTANT = 0; DURATION_POLICY_TIMED = 1; DURATION_POLICY_INFINITE = 2; }
enum RemoveReason { REMOVE_REASON_NONE = 0; REMOVE_REASON_EXPIRED = 1; REMOVE_REASON_MANUAL = 2; REMOVE_REASON_DISPELLED = 3; REMOVE_REASON_DEATH = 4; REMOVE_REASON_REPLACED = 5; }
enum EventKind { EVENT_KIND_UNSPECIFIED = 0; EVENT_KIND_DAMAGE = 1; EVENT_KIND_EFFECT_APPLIED = 2; EVENT_KIND_EFFECT_TICKED = 3; EVENT_KIND_EFFECT_REMOVED = 4; EVENT_KIND_CUE = 5; EVENT_KIND_CAST_ENDED = 6; }
enum PhaseKind { PHASE_KIND_RULE_PLAN = 0; PHASE_KIND_TIMELINE = 1; }
enum TimelineAction { TIMELINE_ACTION_CUE = 0; TIMELINE_ACTION_HIT = 1; TIMELINE_ACTION_END = 2; }

message Modifier { AttributeId attribute = 1; ModifierOp op = 2; float value = 3; }
message EffectSpec {
  int32 definition_id = 1; DurationPolicy duration = 2; int32 duration_ms = 3;
  int32 period_ms = 4; repeated string tags = 5; repeated Modifier modifiers = 6;
}
message TimelineEvent { int32 time_ms = 1; TimelineAction action = 2; string cue = 3; float damage_scale = 4; }
message Phase { PhaseKind kind = 1; bool commit_cost = 2; repeated TimelineEvent events = 3; }
message SkillFlow { int32 id = 1; string name = 2; repeated Phase phases = 3; }
message SkillDef {
  int32 id = 1; string name = 2; int32 slot = 3; int32 flow_id = 4;
  float mana_cost = 5; int32 cooldown_ms = 6; repeated string blocked_by_tags = 7;
}
message NpcDef { int32 id = 1; string prefab = 2; }
message Catalog { repeated SkillDef skills = 1; repeated SkillFlow flows = 2; repeated NpcDef npcs = 3; }

message CreateEntity { int32 id = 1; string name = 2; float max_hp = 3; float attack = 4; float max_mana = 5; }
message EntityId { int32 id = 1; }
message CastSkill { int32 source_id = 1; int32 target_id = 2; int32 skill_id = 3; }
message Tick { int32 delta_ms = 1; }
message ApplyEffect { int32 target_id = 1; EffectSpec effect = 2; }
message RemoveEffect { int32 target_id = 1; uint64 instance_id = 2; RemoveReason reason = 3; }
message SetTag { int32 entity_id = 1; string tag = 2; bool present = 3; }
message SetAttribute { int32 entity_id = 1; AttributeId attribute = 2; float value = 3; }
message DealDamage { int32 source_id = 1; int32 target_id = 2; float amount = 3; }
message ExecuteGm { string command = 1; }
message SnapshotQuery { int32 entity_id = 1; } // 0 = all entities
message Empty {}
message Request {
  uint32 version = 1;
  uint64 request_id = 2;
  oneof body {
    CreateEntity create_entity = 10;
    EntityId delete_entity = 11;
    CastSkill cast_skill = 12;
    Tick tick = 13;
    ApplyEffect apply_effect = 14;
    RemoveEffect remove_effect = 15;
    SetTag set_tag = 16;
    SetAttribute set_attribute = 17;
    SnapshotQuery snapshot = 18;
    DealDamage damage = 19;
    EntityId cancel_cast = 20;
    EntityId find_npc = 21;
    ExecuteGm gm = 22;
    Empty npc_catalog = 23;
  }
}
message EffectSnapshot { uint64 instance_id = 1; int32 definition_id = 2; int64 remaining_ms = 3; }
message EntitySnapshot {
  int32 id = 1; string name = 2;
  float max_hp = 3; float hp = 4; float attack = 5; float mana = 6; float max_mana = 7;
  repeated string tags = 8; repeated EffectSnapshot effects = 9;
  bool casting = 10; int32 skill_id = 11; bool can_move = 12; bool can_cast = 13;
}
message CombatEvent {
  EventKind kind = 1; int32 source_id = 2; int32 target_id = 3;
  float damage = 4; int32 definition_id = 5; uint64 effect_instance_id = 6;
  RemoveReason remove_reason = 7; string cue = 8; uint32 tick_count = 9;
}
message Response {
  uint32 version = 1; uint64 request_id = 2; ErrorCode status = 3; string error = 4;
  repeated EntitySnapshot entities = 5; repeated CombatEvent events = 6;
  uint64 effect_instance_id = 7; NpcDef npc = 8; string message = 9; bool clear_log = 10;
  uint64 beat_index = 11; int64 time_ms = 12; repeated NpcDef npc_catalog = 13;
}
